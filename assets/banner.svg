<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Filters for Glow Effects -->
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    /* Continuous Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes floatParticle1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes floatParticle2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(18px) rotate(-8deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes barGrow {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.15); }
    }
    @keyframes ringRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .animated-glow1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .animated-glow2 {
      animation: pulseGlow 10s ease-in-out infinite 2s;
      transform-origin: 1000px 300px;
    }
    .floating-shape1 {
      animation: floatParticle1 6s ease-in-out infinite;
    }
    .floating-shape2 {
      animation: floatParticle2 7s ease-in-out infinite;
    }
    .wave-line {
      stroke-dasharray: 12 8;
      animation: waveDash 15s linear infinite;
    }
    .rotating-ring {
      animation: ringRotate 25s linear infinite;
      transform-origin: 1020px 200px;
    }
  </style>

  <!-- Base Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="400" fill="url(#grid)" rx="16"/>

  <!-- DYNAMIC BACKGROUND ELEMENTS (LOWER Z-INDEX & DEEP OPACITY) -->
  <!-- Ambient Glow Orbs -->
  <circle class="animated-glow1" cx="200" cy="100" r="180" fill="#f59e0b" opacity="0.3" filter="url(#glow-purple)"/>
  <circle class="animated-glow2" cx="1000" cy="300" r="220" fill="#8b5cf6" opacity="0.25" filter="url(#glow-purple)"/>
  <circle cx="600" cy="380" r="150" fill="#ec4899" opacity="0.15" filter="url(#glow-purple)"/>

  <!-- Background Data Visualization Curves & Chart Elements (Soft / Dynamic Background) -->
  <g opacity="0.25">
    <!-- Animated Trend Line -->
    <path class="wave-line" d="M 50 280 Q 250 180, 450 260 T 850 160 T 1150 220" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <path class="wave-line" d="M 50 310 Q 300 220, 550 300 T 950 190 T 1150 250" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    
    <!-- Rotating Decorative Tech Ring on Right -->
    <g class="rotating-ring">
      <circle cx="1020" cy="200" r="120" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8 12"/>
      <circle cx="1020" cy="200" r="140" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="4 16 12 8"/>
    </g>

    <!-- Floating Inventory/Analytics Nodes -->
    <g class="floating-shape1">
      <circle cx="150" cy="120" r="6" fill="#f59e0b"/>
      <line x1="150" y1="120" x2="220" y2="150" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="220" cy="150" r="4" fill="#ec4899"/>
    </g>
    <g class="floating-shape2">
      <circle cx="1050" cy="90" r="8" fill="#38bdf8"/>
      <circle cx="920" cy="320" r="5" fill="#10b981"/>
    </g>
  </g>

  <!-- Ambient Decorative Icons / Graphics (Right Side Visual Backdrop) -->
  <g class="floating-shape1" opacity="0.18" transform="translate(860, 70)">
    <!-- Plate & Cloche / Restaurant Symbol -->
    <path d="M 40 100 A 60 60 0 0 1 160 100 Z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <line x1="20" y1="104" x2="180" y2="104" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="34" r="8" fill="#ffffff"/>
    <!-- Analytics Bar Chart Overlay -->
    <rect x="50" y="60" width="12" height="30" fill="#f59e0b" rx="2"/>
    <rect x="70" y="45" width="12" height="45" fill="#ec4899" rx="2"/>
    <rect x="90" y="30" width="12" height="60" fill="#8b5cf6" rx="2"/>
    <rect x="110" y="50" width="12" height="40" fill="#38bdf8" rx="2"/>
    <rect x="130" y="40" width="12" height="50" fill="#10b981" rx="2"/>
  </g>

  <!-- FOREGROUND LAYER: TITLE & SUBTITLE HIGH-CONTRAST READABILITY BACKDROP -->
  <!-- Glassmorphism Card Container guaranteeing 100% foreground text protection -->
  <rect x="80" y="65" width="1040" height="270" rx="20" fill="url(#glass-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
  <!-- Dark vignette backing behind text area for ultimate contrast -->
  <rect x="100" y="85" width="1000" height="230" rx="16" fill="#0f172a" opacity="0.65"/>

  <!-- FOREGROUND CONTENT (TOP Z-INDEX, CRISP & VIBRANT) -->

  <!-- Badge / Top Category Label -->
  <g transform="translate(140, 112)">
    <rect width="320" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1.5">
      🍽️ CURATED RESOURCE DIRECTORY
    </text>
  </g>

  <!-- Main Title -->
  <text x="140" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Awesome Restaurant Inventory Management
  </text>
  
  <!-- Title Gradient Accent Bar -->
  <rect x="140" y="208" width="560" height="4" rx="2" fill="url(#accent-grad)"/>

  <!-- Subtitle -->
  <text x="140" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    SaaS Platforms, Open-Source Software, POS Integrations &amp; Food Cost Control
  </text>

  <!-- Feature Pill Tags in Foreground -->
  <g transform="translate(140, 275)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
        📊 Commercial SaaS
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(162, 0)">
      <rect width="165" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10b981">
        💻 Open-Source Projects
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(339, 0)">
      <rect width="155" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ec4899">
        🧪 Recipe &amp; Food Cost
      </text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(506, 0)">
      <rect width="150" height="28" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f59e0b">
        🧾 Invoice OCR Scans
      </text>
    </g>
  </g>
</svg>
