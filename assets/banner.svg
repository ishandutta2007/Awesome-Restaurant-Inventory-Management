<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400"><defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="50%%" stop-color="#ec4899"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="15" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>.title {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-weight: 800;
  font-size: 50px;
  fill: #ffffff;
}
.subtitle {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-weight: 500;
  font-size: 21px;
  fill: #cbd5e1;
}
.badge-text {
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-weight: 600;
  font-size: 14px;
  fill: #f59e0b;
}
@keyframes pulse {
  0% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.08); opacity: 0.8; }
  100% { transform: scale(1); opacity: 0.4; }
}
@keyframes float1 {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-12px) rotate(2deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
@keyframes float2 {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(10px) rotate(-2deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
@keyframes dash {
  to {
    stroke-dashoffset: -40;
  }
}
.pulse-bg {
  animation: pulse 6s ease-in-out infinite;
  transform-origin: center;
}
.floating-card-1 {
  animation: float1 5s ease-in-out infinite;
}
.floating-card-2 {
  animation: float2 7s ease-in-out infinite;
}
.animated-stream {
  stroke-dasharray: 8 8;
  animation: dash 2s linear infinite;
